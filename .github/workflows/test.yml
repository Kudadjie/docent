name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Windows runner images default to core.autocrlf=true, which would check
      # files out with CRLF endings and diverge from every other environment.
      # Force LF before checkout so both platforms test identical bytes.
      - name: Force LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python
        run: uv python install

      # --all-extras: the test suite covers studio/notebook/zotero/backup code,
      # which live in optional extras since the dependency split.
      - name: Install dependencies
        run: uv sync --all-extras

      # Style/type checks are platform-independent — run them once, on Linux.
      - name: Lint
        if: runner.os == 'Linux'
        run: uv run --all-extras ruff check src/ tests/

      - name: Format check
        if: runner.os == 'Linux'
        run: uv run --all-extras ruff format --check src/ tests/

      - name: Type check (incremental scope — see [tool.mypy] in pyproject.toml)
        if: runner.os == 'Linux'
        run: uv run --all-extras mypy

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          PYTHONUNBUFFERED: "1"
          DOCENT_NO_INTERACTIVE: "1"
        run: uv run --all-extras python -u -m pytest -m "not integration and not eval" --timeout=30 --tb=short -q -o addopts=""

      # Coverage gate runs on Linux only (one measurement is enough). The floor
      # is a ratchet: baseline was 50% (2026-07-12) — raise it as coverage
      # grows, never lower it.
      - name: Unit tests + coverage gate (Linux)
        if: runner.os == 'Linux'
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          PYTHONUNBUFFERED: "1"
          DOCENT_NO_INTERACTIVE: "1"
        run: uv run --all-extras python -u -m pytest -m "not integration and not eval" --timeout=30 --tb=short -q -o addopts="" --cov=docent --cov-report=term --cov-fail-under=48

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

  # Smoke-test the static export on every PR — previously this only ran at
  # publish time, so RSC-rewrite or export breakage surfaced only when tagging.
  build-ui:
    name: UI build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # build_ui.py is stdlib-only — the runner's system Python is enough.
      - name: Build static export
        run: python3 scripts/build_ui.py
